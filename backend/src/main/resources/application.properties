quarkus.http.port=8082
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=1M
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:topology}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/topology_hub}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.access-log.enabled=false
hub.web-origin=${HUB_WEB_ORIGIN:http://localhost:3001}
hub.cookie-secure=true
hub.session-hours=12
hub.admin-email=${HUB_ADMIN_EMAIL:guilhermextra118@gmail.com}
hub.admin-password=${HUB_ADMIN_PASSWORD:Dgui@123456789}
hub.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
hub.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
hub.oauth.github.client-id=${GITHUB_CLIENT_ID:}
hub.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/hub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa
%dev.hub.cookie-secure=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:hub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.hub.cookie-secure=false

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: topology_hub
      POSTGRES_USER: topology
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - hub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topology -d topology_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/topology_hub
      DB_USER: topology
      DB_PASSWORD: ${DB_PASSWORD}
      HUB_WEB_ORIGIN: ${HUB_WEB_ORIGIN:-http://localhost:3001}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-true}
      HUB_ADMIN_EMAIL: ${HUB_ADMIN_EMAIL:guilhermextra118@gmail.com}
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:Dgui@123456789}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
volumes:
  hub-db:

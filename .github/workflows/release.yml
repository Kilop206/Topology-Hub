name: Release Topology Hub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ghcr.io/kilop206/topology-hub-backend
          - component: frontend
            context: ./frontend
            image: ghcr.io/kilop206/topology-hub-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          python - "$VERSION" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = sys.argv[1]
          root = ET.parse("backend/pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          backend = root.find("m:version", ns).text
          frontend = json.loads(Path("frontend/package.json").read_text())["version"]
          if backend != expected or frontend != expected:
              raise SystemExit(f"Hub versions do not match tag: backend={backend}, frontend={frontend}, tag={expected}")
          PY

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  release:
    name: Publish GitHub release
    needs: images
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
